[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plcfedfs"
version = "0.1.0"
description = "PLCFedFS implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.scripts]
plcfedfs = "plcfedfs:main"

[tool.setuptools]
py-modules = ["plcfedfs", "prepare", "statistical_analysis"]
